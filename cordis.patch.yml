# dsh-mini-games-lee — bundle patch
#
# One row: the Loader mounts this package's Host half, and `dsh-client-modules`
# reaches the browser half through this package's manifest — `dsh.client.platform`
# opts the package in and `exports["./client"]` names the bundle (dist/client.js);
# `dsh.client.immediately` activates it at boot instead of waiting for a Session.
#
# The name is the BARE PACKAGE NAME, not a relative path, and that matters twice:
#
#  1. Resolution. A bundle patch's inserted rows resolve against the bundle's own
#     directory, not the profile. From `node_modules/dsh-mini-games-lee/` the
#     package name resolves one level up. It fails only under a `link:`/local-path
#     install, where the directory is a junction that Node resolves to its real
#     location outside any `node_modules` — so install from a git/registry spec
#     (a real copy, the way @deepseek-ai bundles do), not from a local path.
#
#  2. Display metadata. `readPluginMeta` in @deepseek-ai/dsh-app-boot opens with
#     `if (barePackageName(specifier) === void 0) return void 0`, so a row named by
#     path gets NO metadata at all: the Plugin Manager falls back to printing the
#     resolved module URL as the component label, and this package's icon and
#     locale/*.json title and description are never read. The bare name is the
#     precondition for all of them.
#
# This file was previously an empty `[]`, which passed the profile validator while
# registering nothing: the plugin was reachable only by pasting
# dist/cordis-plugin.code.txt into the model-driven `cordis_define` tool.

- insert:
    - id: dsh-mini-games-lee
      name: dsh-mini-games-lee
